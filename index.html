<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Lelke Rajtad: napi manna, rövid tanítás és imádság Klára nővér gondolatai nyomán. Tiszta forrás minden napra.">
<title>Lelke Rajtad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --paper:#fffdf8; --raised:#fff6e8; --ink:#4a4038; --soft:#8a7a6a;
  --gold:#f2a93b; --goldd:#e08c1f; --coral:#ff8a5c; --sky:#6aa8cc; --moss:#8fb573;
  --line:rgba(160,120,70,.16); --radius:20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#26211c; --raised:#322a23; --ink:#f7ede0; --soft:#cfbfae;
    --gold:#f5b355; --goldd:#f8c67c; --coral:#ff9b74; --sky:#8cbcd9; --moss:#a3bd8b;
    --line:rgba(247,237,224,.15);
  }
}
:root[data-theme="dark"] {
  --paper:#26211c; --raised:#322a23; --ink:#f7ede0; --soft:#cfbfae;
  --gold:#f5b355; --goldd:#f8c67c; --coral:#ff9b74; --sky:#8cbcd9; --moss:#a3bd8b;
  --line:rgba(247,237,224,.15);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Figtree",-apple-system,"Segoe UI",sans-serif;line-height:1.7}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;text-wrap:balance;font-weight:600;letter-spacing:-0.01em}
.wrap{max-width:680px;margin:0 auto;padding:0 clamp(20px,5vw,40px)}
.hero{position:relative;overflow:hidden;text-align:center;padding:clamp(48px,9vw,88px) 0 clamp(20px,4vw,36px);
  background:radial-gradient(ellipse 800px 440px at 50% -10%, color-mix(in srgb, var(--gold) 28%, transparent), transparent 70%), var(--paper)}
.sun{position:absolute;top:-190px;left:50%;transform:translateX(-50%);width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle at 50% 55%, var(--gold) 0%, color-mix(in srgb, var(--gold) 55%, transparent) 45%, transparent 72%);
  filter:blur(2px);animation:glow 8s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.sun{animation:none}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--goldd);font-weight:700;margin-bottom:16px}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--goldd);opacity:.6}
.hero h1{font-size:clamp(2.3rem,7vw,3.6rem);margin:0 0 10px;position:relative}
.hero h1 em{font-style:italic;color:var(--coral)}
.hero-sub{color:var(--soft);font-size:1rem;max-width:480px;margin:0 auto;position:relative}
.datum{margin-top:22px;font-size:.85rem;color:var(--soft);letter-spacing:.06em;text-transform:uppercase;position:relative}
.block{position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(var(--raised),var(--raised)) padding-box,
    linear-gradient(140deg, color-mix(in srgb, var(--gold) 70%, transparent) 0%, color-mix(in srgb, var(--gold) 12%, transparent) 38%, color-mix(in srgb, var(--coral) 30%, transparent) 100%) border-box;
  border:1px solid transparent;border-radius:var(--radius);
  backdrop-filter:blur(10px) saturate(1.15);-webkit-backdrop-filter:blur(10px) saturate(1.15);
  padding:clamp(24px,5vw,36px);margin:18px 0;
  box-shadow:0 18px 42px -32px color-mix(in srgb, var(--ink) 42%, transparent), inset 0 1px 0 color-mix(in srgb, #fff 30%, transparent)}
.block::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0}
.block.manna::before{background:linear-gradient(135deg, color-mix(in srgb, #fff 34%, transparent) 0%, transparent 38%)}
.block.tanitas::before{background:linear-gradient(190deg, color-mix(in srgb, #fff 26%, transparent) 0%, transparent 46%)}
.block.szosszenet::before{background:radial-gradient(circle at 86% 12%, color-mix(in srgb, #fff 32%, transparent), transparent 48%)}
.block .needle{position:absolute;width:2px;pointer-events:none;z-index:0;
  background:linear-gradient(180deg, transparent, color-mix(in srgb, #fff 75%, var(--gold) 25%) 48%, transparent)}
.block.manna .needle{height:120%;top:-10%;left:14%;transform:rotate(22deg);opacity:.5}
.block.tanitas .needle{height:130%;top:-15%;right:20%;left:auto;transform:rotate(-9deg);opacity:.4}
.block.szosszenet .needle{height:110%;top:-5%;right:12%;left:auto;transform:rotate(16deg);opacity:.45}
.block>*{position:relative;z-index:1}
.block-label{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin-bottom:14px}
.l-manna{background:linear-gradient(180deg, color-mix(in srgb, var(--gold) 85%, #fff 25%), var(--goldd));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 1px color-mix(in srgb, var(--ink) 22%, transparent))}
.l-tanitas{background:linear-gradient(180deg, color-mix(in srgb, var(--sky) 85%, #fff 25%), var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 1px color-mix(in srgb, var(--ink) 22%, transparent))}
.l-szosszenet{background:linear-gradient(180deg, color-mix(in srgb, var(--moss) 85%, #fff 25%), var(--moss));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 1px color-mix(in srgb, var(--ink) 22%, transparent))}
.manna-text{font-family:"Fraunces",serif;font-style:italic;font-size:clamp(1.15rem,3vw,1.45rem);margin:0}
.manna-again{margin-top:16px;position:relative;background:linear-gradient(150deg, color-mix(in srgb, #fff 22%, transparent), color-mix(in srgb, #fff 4%, transparent));
  border:1px solid transparent;background-clip:padding-box;color:var(--soft);border-radius:100px;font:inherit;font-size:.83rem;padding:7px 18px;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 1px 0 color-mix(in srgb, #fff 35%, transparent) inset, 0 8px 18px -14px color-mix(in srgb, var(--ink) 50%, transparent);
  transition:color .15s,box-shadow .15s,transform .1s}
.manna-again::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;border:1px solid var(--line)}
.manna-again:hover{color:var(--goldd)}
.manna-again:hover::after{border-color:var(--goldd)}
.manna-again:active{transform:scale(.97);
  box-shadow:0 1px 0 color-mix(in srgb, #fff 45%, transparent) inset, 0 0 0 4px color-mix(in srgb, var(--gold) 22%, transparent), 0 6px 14px -12px color-mix(in srgb, var(--ink) 55%, transparent)}
.tanitas h2{font-size:clamp(1.35rem,3.4vw,1.7rem);margin:0 0 14px}
.tanitas p{margin:0 0 12px;font-size:1.02rem}
.tanitas p:last-child{margin-bottom:0}
.forras{margin-top:14px;font-size:.78rem;color:var(--soft)}
.szosszenet p{font-family:"Fraunces",serif;font-style:italic;font-size:1.08rem;margin:0}
.nav-days{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px;gap:10px}
.nav-days button{position:relative;background:linear-gradient(150deg, color-mix(in srgb, #fff 22%, transparent), color-mix(in srgb, #fff 4%, transparent));
  border:1px solid transparent;border-radius:100px;color:var(--soft);font:inherit;font-size:.85rem;padding:8px 18px;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 1px 0 color-mix(in srgb, #fff 35%, transparent) inset, 0 8px 18px -14px color-mix(in srgb, var(--ink) 50%, transparent);
  transition:color .15s,box-shadow .15s,transform .1s}
.nav-days button::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;border:1px solid var(--line)}
.nav-days button:hover{color:var(--goldd)}
.nav-days button:hover::after{border-color:var(--goldd)}
.nav-days button:active{transform:scale(.97);
  box-shadow:0 1px 0 color-mix(in srgb, #fff 45%, transparent) inset, 0 0 0 4px color-mix(in srgb, var(--gold) 22%, transparent), 0 6px 14px -12px color-mix(in srgb, var(--ink) 55%, transparent)}
.nav-days button[disabled]{opacity:.35;cursor:default}
footer{text-align:center;padding:34px 0 54px;color:var(--soft);font-size:.82rem}
footer .heart{color:var(--coral)}
</style>
</head>
<body>


<div class="hero">
  <div class="sun"></div>
  <div class="needle" style="height:340px;top:-40px;left:62%;transform:rotate(14deg);opacity:.5"></div>
  <div class="wrap">
    <div class="eyebrow">Klára nővér gondolatai nyomán</div>
    <h1>Lelke <em>Rajtad</em></h1>
    <p class="hero-sub">Minden napra egy manna, egy rövid tanítás és egy imádság. Csendes forrás nehéz és szép napokra.</p>
    <div class="datum" id="datum"></div>
  </div>
</div>

<div class="wrap" id="content">
  <div class="block manna">
    <div class="needle"></div>
    <div class="block-label l-manna">Napi manna</div>
    <p class="manna-text" id="manna"></p>

  </div>
  <div class="block tanitas">

    <div class="block-label l-tanitas">Napi tanítás</div>
    <h2 id="t-title"></h2>
    <div id="t-body"></div>
    <div class="forras" id="t-src"></div>
  </div>
  <div class="block szosszenet">
    <div class="needle"></div>
    <div class="block-label l-szosszenet">Szösszenet</div>
    <p id="sz"></p>
  </div>
  <div class="nav-days">
    <button id="prev">&larr; Előző nap</button>
    <button id="today-btn">Mai nap</button>
    <button id="next">Következő nap &rarr;</button>
  </div>
</div>

<footer>Lelke Rajtad · Betlehem Fényei, Klára nővér gondolatai nyomán, <span class="heart">♥</span></footer>

const START = new Date("2026-08-29T00:00:00");
const HU_DATE = new Intl.DateTimeFormat("hu-HU", { year:"numeric", month:"long", day:"numeric", weekday:"long" });

function dayIndexFor(date) {
  const diff = Math.floor((date - START) / 86400000);
  return ((diff % DAYS.length) + DAYS.length) % DAYS.length;
}
function mannaFor(date) {
  const seed = date.getFullYear()*1000 + (date.getMonth()+1)*50 + date.getDate();
  return MANNA[(seed * 31) % MANNA.length];
}

let offset = 0;
let mannaExtra = 0;
function currentDate() { const d = new Date(); d.setDate(d.getDate() + offset); return d; }
function renderManna() {
  const d = currentDate();
  const seed = d.getFullYear()*1000 + (d.getMonth()+1)*50 + d.getDate();
  const idx = (seed * 31 + mannaExtra * 17) % MANNA.length;
  document.getElementById("manna").textContent = "„" + MANNA[idx] + "”";
}
function show() {
  const d = new Date(); d.setDate(d.getDate() + offset);
  const day = DAYS[dayIndexFor(d)];
  document.getElementById("datum").textContent = HU_DATE.format(d);
  mannaExtra = 0; renderManna();
  document.getElementById("t-title").textContent = day.title;
  document.getElementById("t-body").innerHTML = day.teaching.split(/\n\s*\n/).map(p => "<p>" + p.replace(/&/g,"&amp;").replace(/</g,"&lt;") + "</p>").join("");
  document.getElementById("t-src").textContent = "Forrás: " + day.source;
  document.getElementById("sz").textContent = day.szosszenet;
  document.getElementById("next").disabled = offset >= 0;
}
document.getElementById("manna-again").addEventListener("click", () => { mannaExtra++; renderManna(); });
document.getElementById("prev").addEventListener("click", () => { offset--; show(); });
document.getElementById("next").addEventListener("click", () => { if (offset < 0) { offset++; show(); } });
document.getElementById("today-btn").addEventListener("click", () => { offset = 0; show(); });
show();
</script>
